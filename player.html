<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8월 타운홀 퀴즈</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}
.container {
  background: white;
  border-radius: 24px;
  padding: 32px 24px;
  max-width: 460px;
  width: 100%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  text-align: center;
}
h1 { font-size: 26px; margin-bottom: 8px; color: #333; }
.subtitle { color: #888; font-size: 14px; margin-bottom: 24px; }
.name-input {
  width: 100%;
  padding: 14px 16px;
  border: 2px solid #e0e0e0;
  border-radius: 12px;
  font-size: 16px;
  outline: none;
  transition: border-color 0.3s;
  margin-bottom: 16px;
}
.name-input:focus { border-color: #667eea; }
.start-btn {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}
.start-btn:active { transform: scale(0.97); }

/* 문제 화면 */
.question-screen { display: none; text-align: left; }
.progress-bar-outer {
  width: 100%;
  height: 8px;
  background: #eee;
  border-radius: 4px;
  margin-bottom: 8px;
  overflow: hidden;
}
.progress-bar-inner {
  height: 100%;
  background: linear-gradient(135deg, #667eea, #764ba2);
  border-radius: 4px;
  transition: width 0.3s ease;
  width: 0%;
}
.progress-text {
  text-align: center;
  color: #999;
  font-size: 13px;
  margin-bottom: 20px;
}
.q-number {
  font-size: 15px;
  color: #667eea;
  font-weight: 800;
  margin-bottom: 8px;
  text-align: center;
}
.q-points {
  display: inline-block;
  margin-left: 6px;
  padding: 2px 9px;
  background: #f5f3ff;
  color: #764ba2;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 700;
  vertical-align: middle;
}
.q-text {
  font-size: 19px;
  font-weight: 700;
  color: #333;
  margin-bottom: 20px;
  text-align: center;
  line-height: 1.4;
}

.options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
.opt-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 14px 16px;
  border: 2px solid #e0e0e0;
  border-radius: 14px;
  background: white;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  text-align: left;
  color: #444;
  transition: all 0.2s;
}
.opt-btn .opt-num {
  flex: 0 0 auto;
  width: 26px; height: 26px;
  border-radius: 50%;
  background: #f0f0f0;
  color: #888;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 800;
  transition: all 0.2s;
}
.opt-btn.selected {
  border-color: #667eea;
  background: #f5f3ff;
  color: #4c3fa8;
  box-shadow: 0 4px 16px rgba(102,126,234,0.25);
}
.opt-btn.selected .opt-num { background: #667eea; color: white; }
.opt-btn:active { transform: scale(0.98); }

.text-input {
  width: 100%;
  padding: 14px 16px;
  border: 2px solid #e0e0e0;
  border-radius: 12px;
  font-size: 16px;
  outline: none;
  margin-bottom: 20px;
  transition: border-color 0.3s;
}
.text-input:focus { border-color: #667eea; }

.submit-btn {
  width: 100%;
  padding: 14px;
  background: #e0e0e0;
  color: #999;
  border: none;
  border-radius: 12px;
  font-size: 17px;
  font-weight: 700;
  cursor: not-allowed;
  transition: all 0.3s;
}
.submit-btn.ready {
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  cursor: pointer;
}
.submit-btn.ready:active { transform: scale(0.97); }

/* 완료 화면 */
.done-screen { display: none; text-align: center; }
.done-icon { font-size: 64px; margin-bottom: 16px; }
.done-title { font-size: 24px; font-weight: 700; color: #333; margin-bottom: 8px; }
.done-score { font-size: 48px; font-weight: 800; color: #667eea; margin: 16px 0; }
.done-sub { color: #888; font-size: 15px; }

.fade-in { animation: fadeIn 0.4s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<div class="container">
  <!-- 이름 입력 화면 -->
  <div id="name-screen" class="fade-in">
    <h1>8월 타운홀 퀴즈</h1>
    <p class="subtitle">이름을 입력하고 시작하세요!</p>
    <input id="name" class="name-input" placeholder="이름 입력" maxlength="10">
    <button class="start-btn" onclick="startGame()">시작하기</button>
  </div>

  <!-- 문제 화면 -->
  <div id="question-screen" class="question-screen">
    <div class="progress-bar-outer"><div class="progress-bar-inner" id="progress-bar"></div></div>
    <div class="progress-text" id="progress-text"></div>
    <div class="q-number" id="q-number"></div>
    <div class="q-text" id="q-text"></div>
    <div class="options" id="options"></div>
    <input id="text-answer" class="text-input" style="display:none;" placeholder="답을 입력하세요" autocomplete="off">
    <button class="submit-btn" id="submit-btn" onclick="submitAnswer()">제출</button>
  </div>

  <!-- 완료 화면 -->
  <div id="done-screen" class="done-screen">
    <div class="done-icon">&#127881;</div>
    <div class="done-title">제출 완료!</div>
    <div class="done-score" id="done-score"></div>
    <p class="done-sub" id="done-correct"></p>
    <p class="done-sub">결과는 관리자 화면에서 확인하세요.</p>
  </div>
</div>

<script>
// ================================================================
// 문제 설정 — 여기서 문제/보기/정답/배점을 수정하세요
// type: "mc"(객관식) | "text"(주관식-텍스트) | "number"(주관식-숫자)
// mc: options 배열, correct = 정답의 0부터 시작하는 인덱스
// text: accepted = 정답으로 인정할 문자열 배열 (공백/대소문자 무시하고 비교됨)
// number: correctValue = 정답 숫자
// points: 이 문제의 배점 (원하는 대로 수정 가능, 기본 1점)
// ================================================================
const QUESTIONS = [
  { type: "mc", text: "1. 리터놀의 설립일자는?", options: ["24.7.7", "24.6.7", "23.7.7", "23.6.7"], correct: 2, points: 1 },
  { type: "text", text: "2. 이번 문제는 경상도 사투리 듣기 문제입니다. 박윤진의 발음을 듣고 a, b, c 를 순서대로 작성해주세요. (주관식)\na. '결혼식 사회자'의 사회\nb. '사회 생활'의 사회\nc. 4회", accepted: ["b, a, c"], points: 2 },
  { type: "mc", text: "3. 다음중 우리 검품원의 이름이 아닌 것은?", options: ["최학림", "구경은", "김미영", "김태윤"], correct: 2, points: 2 },
  { type: "number", text: "4. 다음 문제의 답은? (주관식)\n9-3÷⅓-1", correctValue: -1, points: 1 },
  { type: "mc", text: "5. 다음중 나이가 가장 많은 사람은?", options: ["옥창안", "김문규", "김상훈", "김수영"], correct: 2, points: 2 },
  { type: "mc", text: "6. 리터놀의 사업자 번호는?", options: ["632-88-03012", "855-86-03125", "855-88-03012", "632-87-03125"], correct: 3, points: 3 },
  { type: "mc", text: "7. 다음중 생일이 가장 빠른사람은?", options: ["조재성", "김은솔", "주요한", "김유림"], correct: 0, points: 2 },
  { type: "mc", text: "8. 다음 네사람을 입사일 느린 순으로 나열하시오\n(김상훈, 조재성, 최태준, 김유림)", options: ["최태준-김상훈-김유림-조재성", "김상훈-최태준-조재성-김유림", "조재성-김유림-최태준-김상훈", "김유림-조재성-김상훈-최태준"], correct: 1, points: 3 },
  { type: "mc", text: "9. 대한민국의 광복절은?", options: ["1940.8.15", "1935.8.15", "1945.8.15", "1942.8.15"], correct: 2, points: 1 },
  { type: "mc", text: "10. 김유림의 최애 음식은?", options: ["닭발", "곱창", "마라탕", "훠궈"], correct: 3, points: 2 },
  { type: "mc", text: "11. 다음중 우리 고객사(또는 브랜드)가 아닌곳은?", options: ["낼나", "브랜드웍스", "안다르", "컴포트랩"], correct: 2, points: 2 },
  { type: "mc", text: "12. 우리의 월급날은?", options: ["15일", "20일", "24일", "25일"], correct: 3, points: 1 },
  { type: "mc", text: "13. 다음중 리터놀의 3대 핵심가치에 포함되지 않는 것은?", options: ["정직", "정보공유", "선의경쟁", "WIN-WIN"], correct: 2, points: 2 },
  { type: "text", text: "14. 리터놀의 미션을 영어로 적으시오", accepted: ["RETURN ALL TO THEIR OWN PURPOSE"], points: 3 },
  { type: "mc", text: "15. 주요한이 즐겨하는 운동은?", options: ["크로스핏", "헬스", "프사오", "플라잉요가"], correct: 2, points: 2 },
  { type: "text", text: "16. “분좋카”는 무슨 뜻인가요?", accepted: ["분위기 좋은 카페"], keywords: ["분위기", "좋은", "카페"], points: 2 },
  { type: "text", text: "17. “나같경”은 무슨 뜻인가요?", accepted: ["나 같은 경우에는"], keywords: ["나", "같은", "경우"], points: 3 },
  { type: "mc", text: "18. 브랜드명과 브랜드 ID의 매칭이 잘못된 것은?", options: ["이터널 그룹 - ETN", "브론슨 - BRS", "바이젝 - BYZ", "오끼뜨 - OGT"], correct: 2, points: 3 },
  { type: "mc", text: "19. 우리나라 국보 1호는 무엇인가요?", options: ["한글", "숭례문", "경복궁", "석굴암"], correct: 1, points: 1 },
  { type: "mc", text: "20. 리터놀 본사의 주소는?", options: ["서울특별시 마포구 백범로 21길 31", "대전광역시 유성구 전민로 74", "경기도 군포시 당정로 69", "대전광역시 유성구 대학로 179", "서울특별시 마포구 백범로 31길 21", "경기도 군포시 번영로 82-7"], correct: 1, points: 2 },
  { type: "mc", text: "21. 리터놀의 법인등록번호는?", options: ["160111-0665655", "134111-0665650", "160111-0665715", "134111-0665655"], correct: 2, points: 5 },
  { type: "mc", text: "22. 소윤님의 취미 운동은?", options: ["킥복싱", "주짓수", "테니스", "태권도"], correct: 1, points: 2 },
  { type: "mc", text: "23. 은솔님이 키우는 고양이 이름은?", options: ["흑당이", "소금이", "시오", "먼지"], correct: 2, points: 2 },
  { type: "mc", text: "24. 하윤님의 장발은 몇 년 되었을까?", options: ["2년", "5년", "7년", "10년이상"], correct: 3, points: 3 },
  { type: "mc", text: "25. 재성님은 서울-부산을 자전거로 여행한 적이 있다", options: ["O", "X"], correct: 0, points: 2 },
  { type: "mc", text: "26. 다음 중, 상훈님을 괴롭히는 방법은?", options: ["칭찬해달라고 조르기", "하기싫은일 해달라고 조르기", "제일 맛있는거 골라달라고 조르기", "밥사달라고 조르기"], correct: 2, points: 2 },
  { type: "mc", text: "27. 박윤진의 퇴사 사유는?", options: ["옥창안의 직장내 괴롭힘과 무관심", "윤대건의 독단적인 급여 삭감", "김유림의 원치않는 스킨쉽과 포교활동", "진로 변경"], correct: 3, points: 2 },
  { type: "mc", text: "28. 태준님의 본가는?", options: ["고성", "속초", "강릉", "원주"], correct: 2, points: 2 },
  { type: "mc", text: "29. 구성원의 MBTI 매칭이 틀린 것은?", options: ["윤대건 - INTP", "최준호 - INTJ", "김수영 - ESFP", "신지영 - ISFJ"], correct: 1, points: 2 },
  { type: "mc", text: "30. 경석님이 가장 자신 있어하는 베이킹은?", options: ["깜빠뉴", "바게트", "크랙쿠키", "치즈케이크"], correct: 0, points: 2 }
];

// 구글 시트와 연동된 Apps Script 웹앱 URL로 교체하세요 (Code.gs 배포 후 발급되는 URL)
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz90jyqfVCD7pUuJJ7RAOyR1DaWl7WrJA5b2PD86DSCVVDWQsbgxzAoIPdn6SlcWVcXfQ/exec";

const TOTAL_POINTS = QUESTIONS.reduce((sum, q) => sum + q.points, 0);

// 문제 출제 순서 (QUESTIONS 배열의 0부터 시작하는 인덱스). 모든 참가자에게 동일하게 이 순서로 나갑니다.
// 서버에 보내는 문제 번호(q)는 이 순서와 무관하게 항상 원래 번호(1~30)를 그대로 사용해서
// admin.html 통계가 문제별로 정확히 집계됩니다. 순서를 다시 섞고 싶으면 이 배열만 바꾸면 됩니다.
const QUESTION_ORDER = [26, 14, 19, 20, 29, 4, 23, 0, 7, 13, 21, 6, 1, 16, 28, 2, 9, 5, 10, 11, 12, 8, 15, 3, 22, 17, 27, 25, 18, 24];

let currentStep = 0; // 몇 번째 문제를 보여주고 있는지 (0부터)
let selected = -1;
let playerName = "";
let totalScore = 0;
let correctCount = 0;

// 텍스트 정답 비교용 정규화: 공백 제거 + 소문자 변환
function normalize(str) {
  // 공백 + 쉼표/하이픈/슬래시/마침표 무시하고 비교 (예: "b, a, c" = "bac" = "b-a-c")
  return String(str).replace(/[\s,\-\/.]/g, "").toLowerCase();
}

function startGame() {
  playerName = document.getElementById("name").value.trim();
  if (!playerName) { alert("이름을 입력해주세요."); return; }

  currentStep = 0;

  document.getElementById("name-screen").style.display = "none";
  document.getElementById("question-screen").style.display = "block";
  document.getElementById("question-screen").classList.add("fade-in");

  showQuestion();
}

function showQuestion() {
  const qIndex = QUESTION_ORDER[currentStep]; // QUESTIONS 배열 안에서의 원래 인덱스
  const q = QUESTIONS[qIndex];
  selected = -1;

  document.getElementById("progress-bar").style.width = Math.round((currentStep / QUESTIONS.length) * 100) + "%";
  document.getElementById("progress-text").textContent = `${currentStep + 1} / ${QUESTIONS.length}`;
  const pointsLabel = q.points % 1 === 0 ? q.points : q.points.toFixed(1);
  document.getElementById("q-number").innerHTML = `Q${currentStep + 1}<span class="q-points">${pointsLabel}점</span>`;
  const displayText = q.text.replace(/^\d+\.\s*/, "");
  document.getElementById("q-text").innerHTML = displayText.split("\n").join("<br>");

  const optionsDiv = document.getElementById("options");
  const textInput = document.getElementById("text-answer");
  optionsDiv.innerHTML = "";
  textInput.value = "";

  if (q.type === "mc") {
    textInput.style.display = "none";
    optionsDiv.style.display = "flex";
    const nums = ["①", "②", "③", "④", "⑤", "⑥"];
    q.options.forEach((opt, i) => {
      const btn = document.createElement("button");
      btn.className = "opt-btn";
      btn.innerHTML = `<span class="opt-num">${nums[i]}</span><span>${opt}</span>`;
      btn.onclick = () => selectOption(i);
      optionsDiv.appendChild(btn);
    });
  } else {
    optionsDiv.style.display = "none";
    textInput.style.display = "block";
    textInput.placeholder = q.type === "number" ? "숫자로 답을 입력하세요" : "답을 입력하세요";
    textInput.oninput = () => {
      document.getElementById("submit-btn").className = textInput.value.trim() ? "submit-btn ready" : "submit-btn";
    };
  }

  document.getElementById("submit-btn").className = "submit-btn";
  document.getElementById("submit-btn").textContent = "제출";
}

function selectOption(i) {
  selected = i;
  document.querySelectorAll(".opt-btn").forEach((btn, idx) => {
    btn.className = "opt-btn" + (idx === i ? " selected" : "");
  });
  document.getElementById("submit-btn").className = "submit-btn ready";
}

function gradeCurrent() {
  const q = QUESTIONS[QUESTION_ORDER[currentStep]];
  let isCorrect = false;
  let answerRecord = "";

  if (q.type === "mc") {
    isCorrect = selected === q.correct;
    answerRecord = selected >= 0 ? q.options[selected] : "";
  } else if (q.type === "number") {
    const raw = document.getElementById("text-answer").value.trim();
    answerRecord = raw;
    const parsed = parseFloat(raw.replace(/[^0-9.\-]/g, ""));
    isCorrect = !isNaN(parsed) && Math.abs(parsed - q.correctValue) < 0.0001;
  } else if (q.type === "text") {
    const raw = document.getElementById("text-answer").value.trim();
    answerRecord = raw;
    const norm = normalize(raw);
    const exactMatch = q.accepted.some(a => normalize(a) === norm);
    // keywords가 있으면 그 단어들이 모두 포함되어 있을 때도 정답으로 인정 (완화된 채점)
    const keywordMatch = q.keywords ? q.keywords.every(k => norm.includes(normalize(k))) : false;
    isCorrect = exactMatch || keywordMatch;
  }

  return { isCorrect, answerRecord, score: isCorrect ? q.points : 0 };
}

// 서버 전송은 백그라운드에서 처리 (Apps Script 응답을 기다리지 않고 바로 다음 문제로 넘어감)
// 실패 시 한 번 조용히 재시도하고, 그래도 실패하면 실패 목록에 쌓아둠(콘솔 확인용)
const failedSubmits = [];
function sendAnswer(qNum, score, answerRecord, isCorrect, isRetry) {
  const body = `name=${encodeURIComponent(playerName)}&q=${qNum}&score=${score}&choice=${encodeURIComponent(answerRecord)}&correct=${isCorrect ? 1 : 0}`;
  fetch(WEB_APP_URL, {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body
  }).catch(() => {
    if (!isRetry) {
      setTimeout(() => sendAnswer(qNum, score, answerRecord, isCorrect, true), 1500);
    } else {
      failedSubmits.push({ qNum, score, answerRecord, isCorrect });
      console.warn("제출 실패(재시도 후에도):", qNum);
    }
  });
}

function submitAnswer() {
  const qIndex = QUESTION_ORDER[currentStep];
  const q = QUESTIONS[qIndex];
  if (q.type === "mc" && selected === -1) return;
  if (q.type !== "mc" && !document.getElementById("text-answer").value.trim()) return;

  const { isCorrect, answerRecord, score } = gradeCurrent();

  // 응답을 기다리지 않고 바로 전송 시작 (백그라운드). q번호는 화면에 보인 순서가 아니라 항상 원래 문제 번호.
  sendAnswer(qIndex + 1, score, answerRecord, isCorrect);

  totalScore += score;
  if (isCorrect) correctCount++;
  currentStep++;
  if (currentStep < QUESTIONS.length) {
    document.getElementById("question-screen").classList.remove("fade-in");
    void document.getElementById("question-screen").offsetWidth;
    document.getElementById("question-screen").classList.add("fade-in");
    showQuestion();
  } else {
    document.getElementById("progress-bar").style.width = "100%";
    document.getElementById("question-screen").style.display = "none";
    document.getElementById("done-score").textContent = totalScore + " / " + TOTAL_POINTS + "점";
    document.getElementById("done-correct").textContent = correctCount + " / " + QUESTIONS.length + "문제 정답";
    document.getElementById("done-screen").style.display = "block";
    document.getElementById("done-screen").classList.add("fade-in");
  }
}

// 엔터키로 시작 / 제출
document.getElementById("name").addEventListener("keydown", e => {
  if (e.key === "Enter") startGame();
});
document.getElementById("text-answer").addEventListener("keydown", e => {
  if (e.key === "Enter") submitAnswer();
});
</script>
